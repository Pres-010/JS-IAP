<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css" />
  </head>
  <body>
    <h1>Simple JS calculator</h1>
<div class="calculator">
    <div class="display">0</div>
    <div class="buttons">
    <button>CE</button>
    <button>C</button>
    <button>+/-</button>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>0</button>
    <button class="decimal-point">.</button>
    <button class="addition operator">+</button>
    <button class="minus operator">-</button>
    <button class="times operator">×</button>
    <button class="division operator">÷</button>
    <button class="equal operator">=</button>
    </div>
</div>
<script src="./calc.js"></script>
  </body>
</html>
